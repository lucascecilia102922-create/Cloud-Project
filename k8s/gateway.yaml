apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
      - name: gateway
        image: loja/gateway:1.0

        ports:
        - containerPort: 8080

        readinessProbe:
          httpGet:
            path: /
            port: 8080

        livenessProbe:
          httpGet:
            path: /
            port: 8080

---
apiVersion: v1
kind: Service

metadata:
  name: gateway

spec:
  selector:
    app: gateway

  ports:
    - port: 80
      targetPort: 8080